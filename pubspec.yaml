name: blaziq
description: "Blaziq — trivia battle app."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.0
  http: ^1.4.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.0
  flutter_native_splash: ^2.4.1
  audioplayers: ^6.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_background.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#1A1A2E"
  image: assets/images/splash_logo.png
  color_dark: "#1A1A2E"
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#1A1A2E"
    color_dark: "#1A1A2E"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/sounds/
